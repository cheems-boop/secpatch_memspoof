# ================= 安全补丁日期伪装 配置 =================
#
# 最省心的改法：不用编辑本文件
#   模块页「打开」  → WebUI 图形界面，选日期、一键应用、一键刷新
#   模块页「执行」  → 打印当前档位表格
#   命令行        → sh bin/setconf.sh -a ro.vendor.build.security_patch 2026-10-05
#
# 手改就改文件末尾那两行，值的写法见下
#
# 值的写法：
#   auto         当月 05 日（每月自动推进）
#   ref:pif      跟随 /data/adb/pif.prop 的 SECURITY_PATCH（推荐，与 PIF 口径一致）
#   ref:disk     分区 build.prop 真值（= 关掉伪装）
#   YYYY-MM-DD   固定日期，例：2026-10-05
#
# 设置里显示的那一行 = zygote 启动时快照的 Build.VERSION.SECURITY_PATCH。
# 所以改完本文件后，需要「重启手机」或「patchctl refresh」（杀 zygote，所有 App 重启）。
# 属性值本身（getprop）是立即生效的。
#
# refresh  刷新策略：reboot（默认）| zygote（配置变更自动重启 zygote）| none
# guard    漂移守护：on 时每 guard_interval 秒校验，被其他模块改回就自动重写
#           归 PIF 管的属性（ro.boot.* / ro.secure / ro.debuggable / ro.build.tags|type|fingerprint）
#           本模块一律不碰，不会打坏 Play Integrity

# 低痕迹相关：
#   max_ahead   目标日期最多允许超前当前月几个月。
#               1（默认）= 可以选到下个月；0 = 只能选本月及以前。
#               超限直接拒绝，避免“一眼假”的值（如直接在 2026 年写 2099）。
#               注意：auto / ref:pif / ref:disk 不受此限（它们是外部真源）。
#   guard_action fix = 发现漂移就改写（会短暂造成 native ≠ Java 快照）
#                report = 只记日志不改写（零痕迹，但别人改回时不会自愈）

refresh=reboot
guard=on
guard_interval=30
guard_action=fix
max_ahead=1

ro.build.version.security_patch=ref:pif
ro.vendor.build.security_patch=ref:pif
